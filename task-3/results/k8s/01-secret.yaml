# Учётные данные БД. Для демонстрации - простые значения.
# В продакшене секрет создаётся из внешнего хранилища (Vault/Secret Manager).
apiVersion: v1
kind: Secret
metadata:
  name: transport-db-secret
  namespace: transport-analytics
type: Opaque
stringData:
  POSTGRES_USER: transport
  POSTGRES_PASSWORD: transport
  POSTGRES_DB: transport
  DB_USER: transport
  DB_PASSWORD: transport
