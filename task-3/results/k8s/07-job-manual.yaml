# Разовый Job с той же конфигурацией, что и CronJob.
# Нужен для ручной проверки и демонстрации (аналог:
#   kubectl create job --from=cronjob/transport-export transport-export-manual -n transport-analytics).
apiVersion: batch/v1
kind: Job
metadata:
  name: transport-export-manual
  namespace: transport-analytics
  labels:
    app: transport-export
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: transport-export
    spec:
      restartPolicy: OnFailure
      containers:
        - name: exporter
          image: transport-exporter:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: transport-db-config
            - secretRef:
                name: transport-db-secret
          volumeMounts:
            - name: export
              mountPath: /export
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: export
          persistentVolumeClaim:
            claimName: transport-export-pvc
