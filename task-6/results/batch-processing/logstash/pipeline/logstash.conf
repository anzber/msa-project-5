input {
  beats {
    port => 5044
    host => "0.0.0.0"
  }
}

filter {
  # Поле ts приходит из logback в ISO-8601, используем его как @timestamp.
  date {
    match => ["ts", "ISO8601"]
    target => "@timestamp"
    tag_on_failure => []
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    manage_template => false
    index => "filebeat-%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}
