---
# POC: Apache Airflow batch-processing pipeline (Sprint 5, Task 1)
# Stack: PostgreSQL (Airflow metadata) + PostgreSQL (business data) + Airflow
#        (LocalExecutor: webserver + scheduler) + Mailpit (SMTP catcher).
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:8080  (airflow / airflow)
#   open http://localhost:8025  (Mailpit web UI - captured emails)
#
x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: msa-task1-airflow:2.10.5
  user: "0:0"
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # --- SMTP: everything is captured by Mailpit (no real mail is sent) ---
    AIRFLOW__SMTP__SMTP_HOST: mailpit
    AIRFLOW__SMTP__SMTP_PORT: '1025'
    AIRFLOW__SMTP__SMTP_STARTTLS: 'false'
    AIRFLOW__SMTP__SMTP_SSL: 'false'
    AIRFLOW__SMTP__SMTP_MAIL_FROM: 'airflow@example.com'
    # --- Business database, exposed to DAGs as Airflow Connection "business_db" ---
    AIRFLOW_CONN_BUSINESS_DB: 'postgresql://batch:batch@business-db:5432/batchdb'
    POC_BUSINESS_CONN: business_db
    POC_DATA_DIR: /opt/airflow/data
    POC_VOLUME_THRESHOLD: '100'
    POC_FLAKY_LOAD: 'true'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./data:/opt/airflow/data
  depends_on:
    airflow-db:
      condition: service_healthy
    business-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    container_name: msa-task1-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  business-db:
    image: postgres:16
    container_name: msa-task1-business-db
    environment:
      POSTGRES_USER: batch
      POSTGRES_PASSWORD: batch
      POSTGRES_DB: batchdb
    volumes:
      - business-db-volume:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "batch", "-d", "batchdb"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: msa-task1-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: msa-task1-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com
        airflow connections add smtp_default \
          --conn-type smtp \
          --conn-host mailpit \
          --conn-port 1025 \
          --conn-extra '{"disable_ssl": true, "disable_tls": true, "from_email": "airflow@example.com"}' || true
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    container_name: msa-task1-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: msa-task1-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-volume:
  business-db-volume:
