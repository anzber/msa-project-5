name: msa-task5

services:
  postgresdb:
    image: postgres:16
    container_name: task5-postgresdb
    restart: unless-stopped
    env_file: ./.env
    environment:
      - POSTGRES_USER=$POSTGRESDB_USER
      - POSTGRES_PASSWORD=$POSTGRESDB_ROOT_PASSWORD
      - POSTGRES_DB=$POSTGRESDB_DATABASE
    ports:
      - $POSTGRESDB_LOCAL_PORT:$POSTGRESDB_DOCKER_PORT
    volumes:
      - ./src/main/resources/schema-all.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/loyality_data.csv:/docker-entrypoint-initdb.d/loyality_data.csv:ro
      - ./postgres/02-seed-loyality.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRESDB_USER -d $POSTGRESDB_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 12

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.17.28'
    container_name: 'task5-elasticsearch'
    restart: 'unless-stopped'
    ports:
      - '9210:9200'
    environment:
      - 'discovery.type=single-node'
      - 'xpack.security.enabled=false'
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    healthcheck:
      test: 'curl -f http://localhost:9200 || exit 1'
      interval: 10s
      timeout: 5s
      retries: 30

  logstash:
    image: 'docker.elastic.co/logstash/logstash:7.17.28'
    container_name: 'task5-logstash'
    restart: 'unless-stopped'
    ports:
      - '5044:5044'
    volumes:
      - './logstash/pipeline:/usr/share/logstash/pipeline/'
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: 'curl -f http://localhost:9600 || exit 1'
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: 'docker.elastic.co/kibana/kibana:7.17.28'
    container_name: 'task5-kibana'
    restart: 'unless-stopped'
    ports:
      - '5601:5601'
    environment:
      - 'ELASTICSEARCH_HOSTS=http://elasticsearch:9200'
    depends_on:
      elasticsearch:
        condition: service_healthy

  filebeat:
    build: 'filebeat'
    container_name: 'task5-filebeat'
    restart: 'unless-stopped'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/var/lib/docker/containers:/usr/share/dockerlogs/data:ro'
    depends_on:
      - 'logstash'

  prometheus:
    image: 'prom/prometheus:v3.4.0'
    container_name: 'task5-prometheus'
    restart: 'unless-stopped'
    volumes:
      - './prometheus/prometheus.yml:/etc/prometheus/prometheus.yml'
      - './prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml'
    ports:
      - '9090:9090'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: 'grafana/grafana:12.0.1'
    container_name: 'task5-grafana'
    restart: 'unless-stopped'
    ports:
      - '3000:3000'
    environment:
      - 'GF_USERS_ALLOW_SIGN_UP=false'
      - 'GF_AUTH_ANONYMOUS_ENABLED=true'
      - 'GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer'
    volumes:
      - './grafana/provisioning:/etc/grafana/provisioning'
    depends_on:
      - 'prometheus'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    depends_on:
      postgresdb:
        condition: service_healthy
    image: batch-processing-task5
    container_name: 'task5-app'
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - BATCH_SIMULATE_FAILURE=${BATCH_SIMULATE_FAILURE:-false}
    ports:
      - '8081:8080'
    restart: no
