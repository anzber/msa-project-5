global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - '/etc/prometheus/alert.rules.yml'

scrape_configs:

  - job_name: 'batch-processing'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']
        labels:
          application: batch-processing

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
